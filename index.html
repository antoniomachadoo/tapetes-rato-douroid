<style>
/* Layout: a printed A4 catalogue shown as a book — spreads on wide screens, single pages on phones, turned sideways like real paper. */
:root{
  --desk:#222925;        /* table the book rests on */

  --desk-muted:#9AA79F;

}
html,body{height:100%}
body{background:var(--desk);color:var(--desk-ink);font-family:var(--body);overflow:hidden;

.app{height:100%;display:flex;flex-direction:column}

.stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:14px}
.navb{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:var(--desk-ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.navb:hover{background:rgba(255,255,255,.14)}
.navb:disabled{opacity:.2;cursor:default}
.navb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;flex:none;touch-action:none;cursor:grab;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.book{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.book.noanim{transition:none}
.slot{position:absolute;top:0;width:794px;height:1123px;z-index:1;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.spine{position:absolute;top:0;left:754px;width:80px;height:1123px;pointer-events:none;z-index:2;
  background:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,.10) 40%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.10) 60%,rgba(0,0,0,0) 100%)}
.stage.single{overflow:hidden}
.slot.leaf{z-index:3;box-shadow:none;will-change:clip-path}
.slot{contain:layout paint;backface-visibility:hidden}
.slot.flap{z-index:4;transform-origin:0 0;will-change:transform;contain:none;overflow:visible;box-shadow:none;background:none}
.flapclip{position:absolute;left:-60px;top:0;width:1708px;height:1123px;overflow:hidden;z-index:4;pointer-events:none}
.flapclip>.slot.flap{left:60px!important}
.flapin{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.flapin.paper{background:#F4F3EE}
.slot.flap>.page{transform:none}
.shade{position:absolute;left:0;top:0;height:3000px;will-change:transform,opacity;transform-origin:0 0;pointer-events:none;z-index:5}
.shade.fold{width:150px;background:linear-gradient(to right,rgba(0,0,0,.22),rgba(0,0,0,.06) 35%,rgba(255,255,255,.18) 70%,rgba(0,0,0,0))}
.shade.curve{width:90px;background:linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0))}

.foot{display:flex;align-items:center;justify-content:center;gap:14px;padding-block:10px 14px;flex:none;font:500 13px var(--body);color:var(--desk-muted);font-variant-numeric:tabular-nums}

/* ---------- printed page ---------- */

.page.L{padding:96px 56px 60px 92px}

.tabs span{flex:1;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:600 8px var(--body);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.95);opacity:.32}

.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:normal}

.th{display:flex;gap:7px}

.pt h3{margin:0 0 6px;font:600 25px/1.1 var(--display);letter-spacing:-.01em}

.spec{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px 14px;font-size:10.5px;color:#3B443D}
.spec li{display:flex;align-items:center;gap:5px}
.spec svg{width:13px;height:13px;stroke:var(--green);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{display:flex;gap:5px;margin-top:9px;align-items:center;font-size:10px;color:var(--muted)}
.sw i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.inc{margin:8px 0 0;font-size:10.5px;line-height:1.5;color:#4E5851}
.inc b{color:var(--ink);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px}
.chips div{font-size:9.5px;color:#4E5851;display:flex;flex-direction:column;gap:4px}
.chips i{display:block;height:38px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lbl{font:600 9.5px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}

/* cover + back + intro */
.cover{background:#EEF0EA;padding:0}
.cover .ph>img{mix-blend-mode:normal}
.back{background:var(--ink);color:#EEF2EE;padding:0}
/* product detail */
[hidden]{display:none!important}
.pt[data-prod]{cursor:pointer}
.pt[data-prod]:hover,.pt[data-prod]:focus-visible{outline:2px solid rgba(30,142,78,.4);outline-offset:8px;border-radius:2px}
.more{display:inline-block;margin-top:9px;font:600 10.5px var(--body);letter-spacing:.04em;color:var(--green)}
.page:not(.cover):not(.back) .ph,.page:not(.cover):not(.back) .ci,.page:not(.cover):not(.back) .th>div{cursor:zoom-in}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,14,11,.74);box-sizing:border-box;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet{position:relative;background:var(--paper);color:var(--ink);width:min(1080px,100%);max-height:100%;overflow:auto;border-radius:10px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.gal{background:var(--paper-2);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gmain{position:relative;width:100%;aspect-ratio:1/1;max-width:100%}

.garr{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.garr.l{left:0}.garr.r{right:0}
.gcount{font:500 12px var(--body);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}

.info{padding:40px 36px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}

.dl{display:grid;grid-template-columns:auto 1fr;font-size:13.5px;margin:0}
.dl dt,.dl dd{margin:0;padding:9px 0;border-bottom:1px solid var(--rule)}
.dl dt{color:var(--muted);padding-right:20px}
.dl dd{font-weight:600;text-align:right}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.cols span{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 7px;border-radius:999px;background:var(--paper-2);font-size:12.5px}
.cols i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pval{font:600 28px var(--display);color:var(--ink);letter-spacing:-.01em}.ptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:2px}.ptab th{font:500 11px var(--body);color:var(--muted);text-align:left;padding:6px 8px;background:#F2F3EF}.ptab td{font:600 15px var(--display);color:var(--ink);padding:8px;border-bottom:1px solid var(--rule)}.ptab td small{font:400 10px var(--body);color:var(--muted)}.pnote{font-size:11.5px;color:var(--muted);margin:8px 0 0;padding-left:16px;display:grid;gap:2px}
.pt .preco{margin-top:6px;font:600 13px var(--display);color:var(--green)}.pt .preco span{font:400 10px var(--body);color:var(--muted);margin-left:4px}
.info .blk{font-size:13.5px;line-height:1.55;color:#3E4740}
.info .blk b{display:block;font:600 10px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.ask{margin-top:auto;border-top:2px solid var(--ink);padding-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#3E4740;user-select:text;-webkit-user-select:text}
.ask strong{color:var(--ink)}
.xclose{position:absolute;top:12px;right:12px;z-index:2;width:42px;height:42px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.xclose svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.xclose:focus-visible,.garr:focus-visible,.gthumbs button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (max-width:760px){.sheet{grid-template-columns:1fr}.info{padding:24px 20px}.info h2{font-size:32px}.info h2 small{font-size:24px}.gal{padding:20px}}
@media print{
  @page{size:A4;margin:0}
  body{overflow:visible;background:#fff;padding:0}
  .app{display:none}
  .printall{display:block!important}

}

  function offsetFor(pair){ if(pair[0]==null) return -W/2; if(pair[1]==null) return W/2; return 0; }
  function setT(off){ curOff=off; book.style.transform='scale('+scale+') translateX('+off+'px)'; }

  function fit(){
    var narrow=wrap.clientWidth<720, tiny=wrap.clientWidth<560;
    var navw=tiny?8:narrow?96:124;
    var aw=Math.max(200,wrap.clientWidth-navw), ah=Math.max(200,wrap.clientHeight-12);
    mode=(aw/ah>1.05 && aw>=640)?'spread':'single';
    var bw=mode==='spread'?2*W:W;
    scale=Math.min(aw/bw, ah/H);
    stage.style.width=Math.round(bw*scale)+'px';
    stage.style.height=Math.round(H*scale)+'px';
    stage.classList.toggle('single',mode==='single');
    render();
  }

  function render(){
    F=null;
    book.replaceChildren();
    if(mode==='spread'){
      var pair=sp(spreadOf(cur)), a=slot(pair[0],0), b=slot(pair[1],W);
      if(a) book.appendChild(a); if(b) book.appendChild(b);
      if(a&&b){ var sn=document.createElement('div'); sn.className='spine'; book.appendChild(sn); }
      setT(offsetFor(pair));
    } else {
      book.appendChild(slot(cur,W)); setT(-W);
    }
    status(); warm(cur);
  }

  function status(){
    var label, idx, total;
    if(mode==='spread'){
      var s=spreadOf(cur), pair=sp(s); idx=s+1; total=S;
      var ns=pair.map(function(p){return p==null?null:NUMS[p];}).filter(Boolean);
      label= pair[1]===0?'Capa' : (pair[0]===N-1&&pair[1]==null)?'Contracapa' : ns.length===2?'Páginas '+ns[0]+'–'+ns[1] : ns.length===1?'Página '+ns[0] : 'Capa';
      prevB.disabled=s===0; nextB.disabled=s===S-1;
    } else {
      idx=cur+1; total=N;
      label= cur===0?'Capa' : cur===N-1?'Contracapa' : NUMS[cur]?'Página '+NUMS[cur]:'Página em branco';
      prevB.disabled=cur===0; nextB.disabled=cur===N-1;
    }
    where.textContent=label; count.textContent=idx+' / '+total;
    var best='0'; Array.prototype.forEach.call(jump.options,function(o){ if(+o.value<=cur) best=o.value; }); jump.value=best;
  }

  /* ---------- page curl engine ----------
     Book space: spread is [0,2W] x [0,H]. The turning leaf spans [L,L+W].
     The grabbed corner C is dragged to P; the fold is the perpendicular bisector of CP.
     The flap (back of the leaf) is the reflection of the leaf part beyond the fold. */
  function clipPoly(pts,fn){ var out=[]; for(var i=0;i<pts.length;i++){ var a=pts[i], b=pts[(i+1)%pts.length], fa=fn(a), fb=fn(b);
      if(fa>=0) out.push(a); if((fa>=0)!==(fb>=0)){ var t=fa/(fa-fb); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]); } } return out; }
  function polyCss(p){ return p.length<3?'polygon(0 0,0 0,0 0)':'polygon('+p.map(function(q){return q[0].toFixed(1)+'px '+q[1].toFixed(1)+'px';}).join(',')+')'; }
  var RECT=[[0,0],[W,0],[W,H],[0,H]];
  function shade(cls){ var d=document.createElement('div'); d.className='shade '+cls; return d; }

  function setupFlip(dir){
    var o={dir:dir};
    if(mode==='spread'){
      var s=spreadOf(cur), t=s+dir; if(t<0||t>=S) return null;
      var c=sp(s), n=sp(t);
      o.newCur=n[0]!=null?n[0]:n[1]; o.offFrom=offsetFor(c); o.offTo=offsetFor(n);
      if(dir>0){ o.staticI=c[0]; o.staticX=0; o.underI=n[1]; o.underX=W; o.frontI=c[1]; o.backI=n[0]; o.L=W; o.sx=W; o.cx=2*W; }
      else { o.staticI=c[1]; o.staticX=W; o.underI=n[0]; o.underX=0; o.frontI=c[0]; o.backI=n[1]; o.L=0; o.sx=W; o.cx=0; }
      if(o.frontI==null) return null;
    } else {
      var tp=cur+dir; if(tp<0||tp>=N) return null;
      o.newCur=tp; o.offFrom=o.offTo=-W; o.single=true; o.staticI=null; o.underX=W; o.backI=-1; o.L=W; o.sx=W; o.cx=2*W;
      if(dir>0){ o.underI=tp; o.frontI=cur; } else { o.underI=cur; o.frontI=tp; o.reverse=true; }
    }
    o.sign=o.cx>o.sx?1:-1; o.cy=H;
    book.replaceChildren();
    var st=slot(o.staticI,o.staticX); if(st) book.appendChild(st);
    var un=slot(o.underI,o.underX); if(un){ o.unShade=shade('cast'); un.appendChild(o.unShade); book.appendChild(un); }
    if(mode==='spread'){ var sn=document.createElement('div'); sn.className='spine'; book.appendChild(sn); }
    o.front=slot(o.frontI,o.L,'leaf'); o.frShade=shade('curve'); o.front.appendChild(o.frShade); book.appendChild(o.front);
    o.back=document.createElement('div'); o.back.className='slot flap'; o.back.style.left='0px';
    o.backIn=document.createElement('div'); o.backIn.className='flapin'+(o.backI>=0?'':' paper');
    var bp=o.backI>=0?el(o.backI):null; if(bp) o.backIn.appendChild(bp);
    o.bkShade=shade('fold'); o.backIn.appendChild(o.bkShade); o.back.appendChild(o.backIn); var clip=document.createElement('div'); clip.className='flapclip'; clip.appendChild(o.back); book.appendChild(clip);
    return o;
  }
  function cons(o,P){
    // the page stays attached at the spine: the grabbed point can never be further from
    // the top or bottom of the spine than it is on the flat page
    var A=[o.sx,0], B=[o.sx,H], rA=Math.hypot(W,o.cy), rB=Math.hypot(W,H-o.cy);
    // keep the grab height close to where it started, so the sheet turns instead of being pulled away
    var lim=H*0.18; P=[P[0], Math.max(o.cy-lim, Math.min(o.cy+lim, P[1]))];
    for(var k=0;k<3;k++){
      var dx=P[0]-A[0], dy=P[1]-A[1], d=Math.hypot(dx,dy); if(d>rA){ P=[A[0]+dx*rA/d, A[1]+dy*rA/d]; }
      dx=P[0]-B[0]; dy=P[1]-B[1]; d=Math.hypot(dx,dy); if(d>rB){ P=[B[0]+dx*rB/d, B[1]+dy*rB/d]; }
    }
    return P;
  }
  function progress(o,P){ return Math.max(0,Math.min(1,(o.cx-P[0])*o.sign/(2*W))); }
  function draw(o,P){
    P=cons(o,P); o.P=P;
    var C=[o.cx,o.cy], dx=C[0]-P[0], dy=C[1]-P[1], len=Math.hypot(dx,dy), L=o.L;
    var pr=progress(o,P);
    setT(o.offFrom+(o.offTo-o.offFrom)*pr);
    if(len<0.5){ o.front.style.clipPath='none'; o.back.style.display='none'; o.frShade.style.opacity=0; if(o.unShade) o.unShade.style.opacity=0; return; }
    o.back.style.display='';
    var nx=dx/len, ny=dy/len, Mx=(C[0]+P[0])/2, My=(C[1]+P[1])/2;
    o.front.style.clipPath=polyCss(clipPoly(RECT,function(p){ return -((p[0]+L-Mx)*nx+(p[1]-My)*ny); }));
    var mfn=function(u){ return [L+W-u[0], u[1]]; };
    o.backIn.style.clipPath=polyCss(clipPoly(RECT,function(p){ var q=mfn(p); return (q[0]-Mx)*nx+(q[1]-My)*ny; }));
    var f=function(u){ var q=mfn(u), k=2*((q[0]-Mx)*nx+(q[1]-My)*ny); return [q[0]-k*nx, q[1]-k*ny]; };
    var f0=f([0,0]), f1=f([1,0]), f2=f([0,1]);
    o.back.style.transform='matrix('+(f1[0]-f0[0])+','+(f1[1]-f0[1])+','+(f2[0]-f0[0])+','+(f2[1]-f0[1])+','+f0[0]+','+f0[1]+')';
    var wS=Math.min(len*0.45,160), a=Math.min(1,len/120);
    // fold highlight on the flap, in flap-local coords
    var u0=[L+W-Mx, My], g=Math.atan2(ny,-nx)*180/Math.PI;
    o.bkShade.style.transform='translate('+u0[0]+'px,'+u0[1]+'px) rotate('+g+'deg) translate(0,-1500px)';
 o.bkShade.style.opacity=a;
    // curve shading on the front leaf (spine side of the fold), leaf-local
    var gf=Math.atan2(-ny,-nx)*180/Math.PI;
    o.frShade.style.transform='translate('+(Mx-L)+'px,'+My+'px) rotate('+gf+'deg) translate(0,-1500px)';
 o.frShade.style.opacity=a;
    // shadow cast onto the revealed page
    if(o.unShade){ var gc=Math.atan2(ny,nx)*180/Math.PI;
      o.unShade.style.transform='translate('+(Mx-o.underX)+'px,'+My+'px) rotate('+gc+'deg) translate(0,-1500px)';
      o.unShade.style.opacity=a*(1-pr*0.7); }
  }
  function doneP(o){ return [o.cx-2*W*o.sign, o.cy]; }
  function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
  function animate(o,from,to,ms,lift,cb){
    var t0=null;
    function step(ts){ if(t0==null) t0=ts; var t=Math.min(1,(ts-t0)/ms), e=ease(t);
      var x=from[0]+(to[0]-from[0])*e, y=from[1]+(to[1]-from[1])*e - lift*Math.sin(Math.PI*e)*(o.cy===H?1:o.cy===0?-1:0);
      draw(o,[x,y]); if(t<1) requestAnimationFrame(step); else cb&&cb(); }
    requestAnimationFrame(step);
  }
  function finish(o,complete){
    busy=true; o.following=false;
    var C=[o.cx,o.cy], D=doneP(o);
    var target=o.reverse ? (complete?C:D) : (complete?D:C);
    var dist=Math.hypot(target[0]-o.P[0], target[1]-o.P[1]);
    animate(o,o.P,target,Math.max(180,Math.min(650,dist*0.55)),0,function(){
      if(complete) cur=o.newCur; busy=false; render(); });
  }
  function autoFlip(dir){
    if(busy) return;
    if(F) F.following=false;
    var o=(F&&F.dir===dir)?F:setupFlip(dir); if(!o) return;
    if(reduce){ cur=o.newCur; render(); return; }
    F=o; busy=true;
    var C=[o.cx,o.cy], D=doneP(o), from=o.P||(o.reverse?D:C), to=o.reverse?C:D;
    animate(o,from,to,900,H*0.12,function(){ cur=o.newCur; busy=false; render(); });
  }

  var modal=document.getElementById('modal'), mImg=document.getElementById('mImg'), mThumbs=document.getElementById('mThumbs'),
      mInfo=document.getElementById('mInfo'), mCount=document.getElementById('mCount'), mClose=document.getElementById('mClose');
  var mk=null, mi=0, lastFocus=null;
  function showImg(i){ var g=PROD[mk].g; mi=(i+g.length)%g.length; mImg.src=g[mi][0]; mImg.alt=g[mi][1];
    mCount.textContent=(mi+1)+' / '+g.length;
    Array.prototype.forEach.call(mThumbs.children,function(b,j){b.setAttribute('aria-current',j===mi?'true':'false');});
    document.getElementById('mPrev').hidden=document.getElementById('mNext').hidden=g.length<2; }
  function openProd(k,src){
    var p=PROD[k]; mk=k; lastFocus=document.activeElement;
    mThumbs.innerHTML=p.g.map(function(x,j){return '<button type="button" data-i="'+j+'" aria-label="Foto '+(j+1)+'"><img src="'+x[0]+'" alt=""></button>';}).join('');
    var h='<div class="lbl">'+p.cat+'</div><h2 id="mName">'+p.n+'<small>'+p.r+'</small></h2><p class="desc">'+p.d+'</p>';
    h+='<dl class="dl">'+p.s.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>';}).join('')+'</dl>';
    if(p.c) h+='<div class="blk"><b>Cores</b><div class="cols">'+p.c.map(function(c){return '<span><i style="background:'+c[1]+'"></i>'+c[0]+'</span>';}).join('')+'</div></div>';
    if(p.i) h+='<div class="blk"><b>Inclui</b>'+p.i+'</div>';
    h+='<div class="blk"><b>Personalização</b>'+p.p+'</div>';
    var cp=p.pr;
    h+='<div class="blk"><b>Preço por unidade</b><div class="pval">'+cp+' €</div><ul class="pnote"><li>Acresce IVA.</li><li>Artigo sem personalização.</li><li>A personalização é orçamentada à parte.</li></ul></div>';
    h+='<div class="ask"><div><strong>'+'Peça o seu orçamento'+'</strong><br>Ref. '+p.r+'</div><div style="text-align:right">geraldouroid@gmail.com<br>939 898 827 · 937 659 457</div></div>';
    mInfo.innerHTML=h;
    var start=0; if(src){ p.g.forEach(function(x,j){ if(src.indexOf(x[0])>-1) start=j; }); }
    modal.hidden=false; mInfo.scrollTop=0; showImg(start); mClose.focus();
  }
  function closeProd(){ modal.hidden=true; mk=null; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
  mClose.addEventListener('click',closeProd);
  modal.addEventListener('click',function(e){ if(e.target===modal) closeProd(); });
  document.getElementById('mPrev').addEventListener('click',function(){showImg(mi-1);});
  document.getElementById('mNext').addEventListener('click',function(){showImg(mi+1);});
  mThumbs.addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) showImg(+b.dataset.i); });
  function prodAt(t){
    if(!t.closest) return null;
    var pt=t.closest('[data-prod]'); if(pt) return [pt.getAttribute('data-prod'),null];
    var box=t.closest('.ph,.ci,.th>div'); if(!box||t.closest('.cover,.back')) return null;
    var im=box.querySelector('img'); var m=im&&im.getAttribute('src').match(/img\/(p\d\d)-/);
    return m&&PROD[m[1]]?[m[1],im.getAttribute('src')]:null;
  }
  prevB.addEventListener('click',function(){autoFlip(-1);});
  nextB.addEventListener('click',function(){autoFlip(1);});
  jump.addEventListener('change',function(){ if(busy) return; cur=+jump.value; render(); });
  document.addEventListener('keydown',function(e){
    if(!modal.hidden){
      if(e.key==='Escape'){e.preventDefault();closeProd();}
      else if(e.key==='ArrowRight'){e.preventDefault();showImg(mi+1);}
      else if(e.key==='ArrowLeft'){e.preventDefault();showImg(mi-1);}
      return;
    }
    if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-prod]')){e.preventDefault();openProd(e.target.closest('[data-prod]').getAttribute('data-prod'));return;}
    if(e.target===jump) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();autoFlip(1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();autoFlip(-1);}
  });

  function toBook(e){ var r=stage.getBoundingClientRect(); return [(e.clientX-r.left)/scale-curOff, (e.clientY-r.top)/scale]; }
  // which way a grab at book point b would turn the page (outer 32% of a turnable page)
  function zoneDir(b){
    var zx=W*0.32;
    if(mode==='spread'){
      var s=spreadOf(cur), pair=sp(s);
      if(s===0 && b[0]>=W && b[0]<=2*W) return 1;
      if(s===S-1 && pair[1]==null && b[0]>=0 && b[0]<W) return -1;
      if(pair[1]!=null && s<S-1 && b[0]>2*W-zx && b[0]<=2*W+4) return 1;
      if(pair[0]!=null && s>0 && b[0]<zx && b[0]>=-4) return -1;
    } else {
      if(cur<N-1 && b[0]>2*W-zx) return 1;
      if(cur>0 && b[0]<W+zx) return -1;
    }
    return 0;
  }
  function nearCorner(b,dir){
    var cx = mode==='single' ? (dir>0?2*W:W) : (dir>0?2*W:0);
    return Math.abs(b[0]-cx)<W*0.16 && (b[1]>H*0.86 || b[1]<H*0.14);
  }
  // in single view the visible page is [W,2W]; stretch the pointer so the flap can travel the full turn
  function ptrP(o,b){ return mode==='single' ? [2*(b[0]-W), b[1]] : b; }

  var down=null, dragging=false, peeking=false, qP=null, qO=null, qRaf=0;
  // the page eases toward the pointer instead of jumping to it, which removes jitter from hand/mouse noise
  function queueDraw(o,P){ qO=o; qP=P; if(!o.Pc) o.Pc=(o.P||[o.cx,o.cy]).slice(); o.following=true; if(!qRaf) qRaf=requestAnimationFrame(follow); }
  function follow(){ qRaf=0; var o=qO; if(!o||o!==F||!o.following) return;
    var k=peeking?0.16:0.32; o.Pc[0]+=(qP[0]-o.Pc[0])*k; o.Pc[1]+=(qP[1]-o.Pc[1])*k;
    draw(o,o.Pc);
    if(Math.hypot(qP[0]-o.Pc[0],qP[1]-o.Pc[1])>0.3) qRaf=requestAnimationFrame(follow); }
  stage.addEventListener('pointerdown',function(e){
    if(busy&&!peeking) return;
    var b=toBook(e); down={b:b, dir:zoneDir(b), x:e.clientX, y:e.clientY, target:e.target};
    dragging=false;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });
  stage.addEventListener('pointermove',function(e){
    var b=toBook(e);
    if(down){
      if(!dragging && Math.hypot(e.clientX-down.x,e.clientY-down.y)>6 && down.dir){
        if(!F||F.dir!==down.dir){ F=setupFlip(down.dir); }
        if(F){ dragging=true; peeking=false; busy=true; var gy=down.b[1]; F.cy = gy<H*0.2 ? 0 : gy>H*0.8 ? H : gy; F.Pc=null; F.P=null; }
      }
      if(dragging&&F) queueDraw(F,ptrP(F,b));
      return;
    }
    if(e.pointerType!=='mouse' || (busy&&!peeking)) return;
    var dir=zoneDir(b);
    if(dir && nearCorner(b,dir)){
      if(!F||F.dir!==dir){ F=setupFlip(dir); if(!F) return; }
      peeking=true; busy=true;
      F.cy = b[1]<H/2 ? 0 : H;
      var C=[F.cx,F.cy];
      if(F.reverse){ queueDraw(F,[doneP(F)[0]+90, F.cy+(F.cy===H?-70:70)]); }
      else { var v=[-F.sign, F.cy===H?-0.8:0.8], d=Math.hypot(v[0],v[1]), want=120;
        if(d<1){ v=[-F.sign,F.cy===H?-1:1]; d=Math.SQRT2; }
        queueDraw(F,[C[0]+v[0]/d*want, C[1]+v[1]/d*want]); }
    } else if(peeking){ var o=F; peeking=false; finish(o,!!o.reverse && false); }
  });
  stage.addEventListener('pointerleave',function(){ if(peeking&&!down){ var o=F; peeking=false; finish(o,false); } });
  function endPointer(e){
    if(!down) return;
    var d=down; down=null;
    if(dragging&&F){ dragging=false; var o=F, pr=progress(o,o.P);
      var complete = o.reverse ? pr<0.5 : pr>0.5;
      finish(o,complete); return; }
    if(peeking&&F){ peeking=false; busy=false; autoFlip(F.dir); return; }
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>6) return;
    var hit=prodAt(d.target); if(hit){ openProd(hit[0],hit[1]); return; }
    var bx=d.b[0]; autoFlip(mode==='spread' ? (bx>=W?1:-1) : (bx>=1.5*W?1:-1));
  }
  stage.addEventListener('pointerup',endPointer);
  stage.addEventListener('pointercancel',function(){ if(dragging&&F){ dragging=false; down=null; finish(F,false);} else down=null; });
  window.addEventListener('resize',function(){ if(!busy) fit(); });
  fit();
})();
</script>

</body></html>
